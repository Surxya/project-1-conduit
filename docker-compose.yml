services:
  # --- DATABASE TIER ---
  db:
    image: postgres:15-alpine
    container_name: conduit-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=conduit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conduit-network

  # --- BACKEND TIER ---
  backend:
    build: ./backend
    image: conduit-backend:v1
    container_name: conduit-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/conduit?schema=public
      - NODE_ENV=production
      - SECRET=supersecretkey123
    depends_on:
      - db
    networks:
      - conduit-network

  # --- FRONTEND TIER ---
  frontend:
    build: ./frontend
    image: conduit-frontend:v1
    container_name: conduit-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - conduit-network

# --- VOLUMES & NETWORKS ---
volumes:
  postgres_data:

networks:
  conduit-network:
    driver: bridge

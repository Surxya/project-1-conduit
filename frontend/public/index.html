<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ionicons@2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic" rel="stylesheet" type="text/css">
    <title>Conduit</title>
    <style>
      body { font-family: 'Source Sans Pro', sans-serif; }
      
      /* Layout alignment fixes */
      .container { max-width: 1140px; }
      nav.navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; }
      nav.navbar ul { display: flex !important; flex-direction: row !important; list-style: none; margin: 0; padding: 0; }
      nav.navbar ul li { margin-left: 1rem; }
      
      .navbar-brand { font-family: 'Titillium Web', sans-serif; font-size: 1.5rem; font-weight: 700; color: #5CB85C !important; }
      .nav-link { color: rgba(0,0,0,0.3) !important; font-size: 0.9rem; padding: 0.4rem 0.8rem; }
      .nav-link.active { color: rgba(0,0,0,0.8) !important; }
      
      .banner { background: #5CB85C; color: #fff; padding: 2rem 1rem; text-align: center; box-shadow: inset 0 8px 8px -8px rgba(0, 0, 0, 0.3), inset 0 -8px 8px -8px rgba(0, 0, 0, 0.3); }
      .banner h1 { font-family: 'Titillium Web', sans-serif; font-size: 3.5rem; text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3); font-weight: 700; line-height: 1; }
      .banner p { font-size: 1.5rem; font-weight: 300; margin-bottom: 0; }
      
      .sidebar { background: #f3f3f3; padding: 5px 10px 10px 10px; border-radius: 4px; }
      .tag-default { background-color: #818a91; color: #fff; font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 10rem; display: inline-block; margin: 2px; }
      .nav-pills .nav-link.active { background-color: #5CB85C !important; color: #fff !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

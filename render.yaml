services:
  # 1. Backend API Service
  - type: web
    name: conduit-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: conduit-db
          property: connectionString

  # 2. Frontend React + Nginx Service
  - type: web
    name: conduit-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: conduit-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: conduit-db
    databaseName: conduit
    user: conduit_user
    plan: free
